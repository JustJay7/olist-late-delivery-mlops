name: CI

# Runs on every push (any branch) and on every PR into main.
# The ruleset on main requires the `lint` and `unit-tests` jobs to pass before merging.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older run, so results always match the latest code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the two lint tools, at the versions pinned in requirements-dev.txt, so this job stays fast.
      - run: pip install black==26.10.1 flake8==7.5.0
      - run: black --check .
      - run: flake8

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: pytest tests/unit
